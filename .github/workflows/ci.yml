name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node toolchain
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Setup PureScript tooling
        run: npm ci

      - name: Cache PureScript dependencies
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-spago-${{ hashFiles('spago.yaml', 'spago.lock', 'package-lock.json') }}
          path: |
            .spago
            output

      - name: Build the project
        run: npm run build

      - name: Test
        run: npm test

      - name: Check Formatting
        run: npm run format:check
